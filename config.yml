provider: openrouter  # | ollama
# Тиры low-cost (цены проверены живьём через /api/v1/models, июнь 2026):
model:                                  # роутинг/валидация/extraction — дёшево и быстро
  name: google/gemini-3.1-flash-lite    # $0.25 in / $1.50 out, ctx 1M
  temperature: 0
code_model:                             # агентское исполнение шагов / код
  name: z-ai/glm-5.1                    # $0.98 in / $3.08 out, ctx 1M
  temperature: 0
deep_model:                             # ТОЛЬКО heavy-ревью и редкое глубокое мышление
  name: deepseek/deepseek-v4-pro        # $0.435 in / $0.87 out (промо), ~Opus-уровень агентики
  temperature: 0
ollama:
  base_url: http://localhost:11434/v1
  model: nemotron-3-nano:4b      # Q4 — быстрее (~2× к q8), ~2.8ГБ
  code_model: nemotron-3-nano:4b
  embed_model: nomic-embed-text  # эмбеддинги, если включены
  #num_ctx: 16384              # ВАЖНО: промпты агента ~6–8k токенов → контекст ≥8k обязателен
agent:
  max_create_retries: 2
  max_global_retries: 1   # full-retry пере-запускает дорогой research → 1 ретрая хватает на реальный сбой
  low_confidence_threshold: 0.7
  max_subtask_retries: 2
  max_subtasks: 6
  ambiguity_gate: 0.6        # ambiguity >= порога → переспросить (clarify), а не гадать
  clarify_soft_gate: 0.3     # средняя неоднозначность [soft..gate) на пути с инструментами → батч уточнений
  consensus_validation: true  # финальную валидацию подтверждают 2 модели (мульти-модельный консенсус)
  require_confirmation: true  # human-in-the-loop: side-effect навыки (skills.confirm) требуют подтверждения
  max_revisions: 1            # heavy-режим: сколько раундов «сквозной ревью → доработка» после сборки
  retry_confidence: 0.5       # полный ретрай пайплайна только если conf ниже (или is_valid=false); 0.5–0.7 принимаем
  step_iter_limit: 10         # потолок витков ReAct-цикла одного шага (анти-разгон токенов)
  max_steps_per_run: 8        # глобальный потолок исполнений шага на прогон
  max_run_tokens: 120000      # жёсткий токен-бюджет прогона (≈$0.02) — стоп-кран от runaway
  max_run_seconds: 150        # wall-clock дедлайн прогона (сек) — стоп от медленного heavy
  max_output_tokens: 8000     # потолок ВЫХОДА одного LLM-вызова: structured-output (decompose/…) не должен обрезаться (LengthFinishReasonError) — thinking-модели тратят output на размышление
  llm_timeout: 60             # потолок одного LLM-вызова (с): 60с = явный хэнг; внутр. дедлайн прогона успевает прерваться до eval-враппера
intent:
  min_sim: 0.30               # глоб. порог уверенности intent-роутера (cosine-kNN); калибровано route_eval. Ниже — fallback на регэксп
  min_sim_per_label:          # PER-LABEL переопределения (тюнинг по confusion-структуре)
    web_grounding: 0.23       # ниже: его промахи почти все «None» (не кросс) → ловим больше grounding без риска перепутать (recall 76→87%)
semantic_signals:             # анти-галлюцинация БЕЗ регэкспов: paywall — embedding-классификатор (любой язык)
  paywall_threshold: 0.58     # порог cosine к позитивным seed'ам стены подписки (консервативный; калибровать на размеченном наборе)
  paywall_margin: 0.05        # маржа над лучшим НЕГАТИВНЫМ seed'ом (контраст: «сейчас играет»/«бесплатно» ≠ «оформите подписку»)
checkpointer:
  backend: sqlite
  sqlite_path: data/checkpoints.db
memory:
  db_path: data/memory.db
  recall_k: 5
  reflect_every: 5
  recall_budget_chars: 1800
  embeddings: true              # эмбеддинги памяти вкл (OPEN_ROUTER_API_KEY); recall эмбеддит запрос ОДИН раз
  embedding_model: openai/text-embedding-3-small
  recall_gate: 0.22             # «recall не всегда»: ассоциативная память (эпизоды/выводы) инжектится только если top_score>=gate; персона-факты всегда. 0=выкл гейт
  graph_hops: 1                 # GraphRAG-lite: глубина spreading-activation от релевантных сидов (0=выкл графовый recall)
  graph_decay: 0.6              # затухание буста на хоп
  graph_seed_min: 0.3           # минимальная релевантность узла, чтобы стать сидом графового пула (PII-контейнмент: нерелевантно→не тянем)
  max_episodes: 2000
  max_facts: 300
  max_reflections: 200
skills:
  base_path: src/skills
  protected:
  - web_search
  - file_operations
  - text_file_processor
  - link_parser
  - uv_package_manager
  - device_control
  - deep_agent
  - app_control
  - ax_control
  - phone_control
  - stash
  confirm:                   # side-effect навыки: вызов тула требует подтверждения человека (HITL)
  - device_control
  - app_control
  - ax_control
  - phone_control
  - browser_control          # действия в браузере агента (browser_see — read-only, без вопросов)
  autosync: true
  temp_ttl_days: 7           # временные (не принятые в библиотеку) навыки старше TTL чистятся при старте
mcp:
  auto_trust_discovered: false
  discover_limit: 8
improve:
  auto: false
  optimizer: textgrad
  min_failures: 3
  min_failures_user: 3   # порог неудач ОДНОГО юзера для per-user backward (оптимизация под него)
  measure_before_after: true  # accept промпта только если внутренний прогон ДО/ПОСЛЕ показал улучшение
  idle_seconds: 900
  optimize_core_prompts: false  # системные промпты ключевых нод заморожены (политика);
                                # backward правит только промпты саб-агентов-тулов + few-shots

experimental:
  composer: false               # ЭКСПЕРИМЕНТ: вместо «роутер выбирает 1 из 6 режимов-шаблонов»
                                # — мета-контроллер компонует когнитивные примитивы под задачу
                                # (src/agent_experimental.py). Рабочий граф не трогается. Вкл = на свой риск.
  max_steps: 12                 # потолок шагов композиции (анти-залипание мета-контроллера)
