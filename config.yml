provider: openrouter   # openrouter | ollama  (ollama = локально, бесплатно по токенам)
model:
  name: gpt-4o-mini
  temperature: 0
code_model:
  name: google/gemini-3-flash-preview
  temperature: 0
ollama:
  base_url: http://localhost:11434/v1
  model: gpt-oss:20b          # MoE ~3.6B-active, Q4 ~13ГБ — влезает в 24ГБ M4 Pro, холодная
  code_model: qwen2.5-coder:7b  # исполнение/код (7B dense, ~5ГБ)
  embed_model: nomic-embed-text  # эмбеддинги, если включены
  num_ctx: 16384              # ВАЖНО: промпты агента ~6–8k токенов → контекст ≥8k обязателен
agent:
  max_create_retries: 2
  max_global_retries: 2
  low_confidence_threshold: 0.7
  max_subtask_retries: 2
  max_subtasks: 6
  ambiguity_gate: 0.6        # ambiguity >= порога → переспросить (clarify), а не гадать
  consensus_validation: true  # финальную валидацию подтверждают 2 модели (мульти-модельный консенсус)
checkpointer:
  backend: sqlite
  sqlite_path: data/checkpoints.db
memory:
  db_path: data/memory.db
  recall_k: 5
  reflect_every: 5
  recall_budget_chars: 1800
  embeddings: false
  embedding_model: openai/text-embedding-3-small
  max_episodes: 2000
  max_facts: 300
  max_reflections: 200
skills:
  base_path: src/skills
  protected:
  - web_search
  - file_operations
  - text_file_processor
  - link_parser
  - uv_package_manager
  - device_control
  - deep_agent
  - app_control
  - ax_control
  - phone_control
  autosync: true
mcp:
  auto_trust_discovered: false
  discover_limit: 8
improve:
  auto: false
  optimizer: textgrad
  min_failures: 3
  idle_seconds: 900
