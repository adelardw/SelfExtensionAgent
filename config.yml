provider: openrouter  # | ollama
coding:
  trajectory_logging: true   # local request/action/outcome journal; no uploads or automatic training
  trajectory_max_bytes: 33554432 # per invocation, incomplete/redacted logs excluded from datasets
  backend: openrouter        # explicit cool/cheap profile; local backends remain available
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.1-flash-lite
  action_protocol: json     # tools is experimental native function transport, cloud only
  native_history: false     # experimental actual assistant/tool continuity, tools protocol only
  context_policy: bounded  # single_action: latest observation + brief + retrievable archive; disables native replay
  planning: required        # adaptive makes separate plan actions optional in auto execution
  structured_output: auto  # advertised JSON Schema / JSON mode / text; local validation always required
  # temperature: 1.0        # optional, model-specific; omitted preserves provider defaults
  # top_p: 0.95             # e.g. North Mini Code model-card recommendation with temperature=1.0
  result_memory: false     # experimental bounded tool-result memory; quality gain not yet established
  # provider_only: [provider/endpoint]  # exact endpoint pin; disables provider fallbacks
  max_cost_usd: 0.10          # worker spend envelope per run; routing separately bounded below
  max_input_usd_per_million: 0.30
  max_output_usd_per_million: 2.0
  max_parameters_b: 10
  context_tokens: 16384       # bounded KV cache for a desktop GPU/unified memory
  cloud_context_tokens: 32768 # cloud thinking has room for output; local context stays 16K
  context_chars: 18000
  max_turns: 48               # pause at checkpoint, resume instead of discarding progress
  max_total_tokens: 120000    # shared request reservations across actors, critic, routing and retrieval
  max_delegates: 2            # top-level delegation groups; descendants share global limits
  worker_turns: 6
  timeout_seconds: 180
  provider_retries: 4         # shared across roles; only rejected 429/503 with Retry-After
  provider_retry_wait_seconds: 15 # total wait allowance, cancellable; spend cap unchanged
  allow_web: true             # generic official documentation queries; no private code in searches
  learn: true                 # promote examples only after verified successful execution
  supervisor_review: false   # free event observer always on; model review is opt-in, max 2 per run
  navigation:
    backend: decisions      # bounded typed scoring; lexical fallback on errors/budget exhaustion
    model: typesafe/jev-1.13 # alternative: liquid/d1-ultra; same Decisions API, no local inference
    max_calls: 2
    max_cost_usd: 0.002
  orchestration:
    enabled: true
    auto_domains: true
    same_model: false         # true: selected backbone also performs decisions and critique
    isolated_writes: true
    observer: true
    local_slots: 1           # logical branches share one local GPU generation slot
    cloud_slots: 2           # simultaneous cloud worker generations; same shared spend/token/node limits
    max_nodes: 12            # new child nodes per run; shared, not multiplied recursively
    max_depth: 3
    root_delegation_min_observations: 1 # inspect/compute once before splitting; 0 disables this heuristic
    max_branches: 3
    mind_turns: 16
    reasoning: low
    decision:
      backend: decisions    # typed mode selection; overridden by same_model
      model: typesafe/jev-1.13
      max_calls: 4          # delegation/anomalies only; no paid observer polling
      max_cost_usd: 0.001
      min_probability: 0.5
      min_margin: 0.1
      planner:              # invoked only when a new profile or subtask decomposition is needed
        model: google/gemini-3.1-flash-lite
        max_calls: 2
        max_cost_usd: 0.004
    critic:
      enabled: true
      backend: openrouter
      model: google/gemini-3.1-flash-lite
      max_calls: 8
      max_cost_usd: 0.02
      active: true          # one compact probe plan + at most two isolated experiments per review
      answer_verification: true # bind numeric/structured JSON answers to executed blind checks
      reference_repair: false   # experimental: checked scalar repairs only in proven agent-added tests
      reference_output_tokens: 1024
      max_probes: 2
  # checks:                   # optional project-specific argv lists; otherwise discover manifests
  #   unit: [python3, -m, pytest, -q, tests/unit]
# Endpoint провайдера. Пусто → https://openrouter.ai/api/v1. Годится любой OpenAI-совместимый
# шлюз/прокси/self-host. Приоритет: env OPENROUTER_BASE_URL (или OPENAI_BASE_URL) → `sea provider
# openrouter <base_url>` → это поле → дефолт.
base_url:            # напр. https://openrouter.ai/api/v1 | http://my-gateway:8000/v1
# Тиры low-cost (цены проверены живьём через /api/v1/models, июнь 2026):
model:                                  # роутинг/валидация/extraction — дёшево и быстро
  name: google/gemini-3.1-flash-lite    # $0.25 in / $1.50 out, ctx 1M
  temperature: 0
code_model:                             # агентское исполнение шагов / код
  name: z-ai/glm-5.1                    # $0.98 in / $3.08 out, ctx 1M
  temperature: 0
deep_model:                             # ТОЛЬКО heavy-ревью и редкое глубокое мышление
  name: deepseek/deepseek-v4-pro        # $0.435 in / $0.87 out (промо), ~Opus-уровень агентики
  temperature: 0
ollama:
  # Локальный или УДАЛЁННЫЙ хост. Приоритет: env OLLAMA_BASE_URL → настройки CLI → это поле →
  # http://localhost:11434/v1. Суффикс /v1 дописывается автоматически, если забыт.
  base_url: http://localhost:11434/v1
  model: nemotron-3-nano:4b      # Q4 — быстрее (~2× к q8), ~2.8ГБ
  code_model: nemotron-3-nano:4b
  embed_model: nomic-embed-text  # эмбеддинги, если включены
  #num_ctx: 16384              # ВАЖНО: промпты агента ~6–8k токенов → контекст ≥8k обязателен
agent:
  max_create_retries: 2
  max_global_retries: 1   # full-retry пере-запускает дорогой research → 1 ретрая хватает на реальный сбой
  low_confidence_threshold: 0.7
  max_subtask_retries: 2
  max_subtasks: 6
  ambiguity_gate: 0.6        # ambiguity >= порога → переспросить (clarify), а не гадать
  clarify_soft_gate: 0.3     # средняя неоднозначность [soft..gate) на пути с инструментами → батч уточнений
  consensus_validation: true  # финальную валидацию подтверждают 2 модели (мульти-модельный консенсус)
  require_confirmation: true  # human-in-the-loop: side-effect навыки (skills.confirm) требуют подтверждения
  max_revisions: 1            # heavy-режим: сколько раундов «сквозной ревью → доработка» после сборки
  retry_confidence: 0.5       # полный ретрай пайплайна только если conf ниже (или is_valid=false); 0.5–0.7 принимаем
  step_iter_limit: 10         # потолок витков ReAct-цикла одного шага (анти-разгон токенов)
  # КАСКАД ЯРУСОВ: легвóрк (поиск/чтение/шаги) дёшев (fast/code), а ФИНАЛЬНАЯ СБОРКА из сжатого
  # дистиллята — УМНОЙ моделью (deep ~Opus, один вызов на ограниченном входе). Ярус сборки:
  synthesis_model: deep       # fast | code | deep — кто собирает финал графа и research-синтез
  max_steps_per_run: 8        # глобальный потолок исполнений шага на прогон (eval/one-shot: тугой)
  max_run_tokens: 120000      # жёсткий токен-бюджет прогона (≈$0.02) — стоп-кран от runaway
  max_run_seconds: 150        # wall-clock дедлайн прогона (сек) — стоп от медленного heavy
  # ── ИНТЕРАКТИВ (desktop/TUI): доводим задачу до конца БЕЗ «продолжи» ──
  # План сам ограничен (≤max_subtasks + капы ретраев + анти-зацикливание), поэтому «безлимит» здесь =
  # «не рубить естественно-конечный план искусственной стеной 150с/8 шагов». Цена зажата размером
  # плана + дешёвым каскадом ярусов (легвóрк fast/code, сборка deep — один вызов). Абсолютный
  # предохранитель от патологии — *_hard: при нём доводим с ЧЕСТНОЙ пометкой (не «скажи продолжи»).
  # eval/GAIA/one-shot этого НЕ получают (тугой бюджет — установка проекта).
  interactive_unlimited: true
  max_run_seconds_hard: 1200  # абсолютный wall-clock предохранитель
  max_steps_hard: 40          # абсолютный потолок шагов
  step_hard_cut_mult: 2.0     # ВНУТРИ-шаговый обрыв вооружается на ×этого от бюджета: ловит только
                              # интра-степ взрыв (1 шаг→1М ток), граничные прогоны режет мягкий потолок

  max_output_tokens: 8000     # потолок ВЫХОДА одного LLM-вызова: structured-output (decompose/…) не должен обрезаться (LengthFinishReasonError) — thinking-модели тратят output на размышление
  llm_timeout: 60             # потолок одного LLM-вызова (с): 60с = явный хэнг; внутр. дедлайн прогона успевает прерваться до eval-враппера
intent:
  min_sim: 0.30               # глоб. порог уверенности intent-роутера (cosine-kNN); калибровано route_eval. Ниже — None, caller полагается на reflexion (без регэксп-костыля)
  min_sim_per_label:          # PER-LABEL переопределения (тюнинг по confusion-структуре)
    web_grounding: 0.23       # ниже: его промахи почти все «None» (не кросс) → ловим больше grounding без риска перепутать (recall 76→87%)
  backend: knn                # knn | jev — jev: TypeSafe JEV через OpenRouter (route_eval 98.1% vs kNN 83.0%, ~$0.00002/запрос, см. TODO.md#JEV); ollama/нет ключа/ошибка → kNN
  jev_model: typesafe/jev-1.13
semantic_signals:             # анти-галлюцинация БЕЗ регэкспов: paywall — embedding-классификатор (любой язык)
  paywall_threshold: 0.58     # порог cosine к позитивным seed'ам стены подписки (консервативный; калибровать на размеченном наборе)
  paywall_margin: 0.05        # маржа над лучшим НЕГАТИВНЫМ seed'ом (контраст: «сейчас играет»/«бесплатно» ≠ «оформите подписку»)
  error_threshold: 0.55       # страница-ошибка (404/«не найдена») — контраст с легит-контентом, любой язык
  error_margin: 0.05
  media_threshold: 0.55       # «звук реально идёт» (фолбэк для extension-прозы; in-repo даёт структурный флаг)
  media_margin: 0.05
safety:                       # детект инъекций/джейлбрейков — ЭМБЕДДИНГ-контраст (не регэксп), любой язык
  injection_threshold: 0.52   # порог cosine к POS-сидам инъекций (контраст с нормальным контентом)
  injection_margin: 0.04
  injection_min_len: 12       # короче — не проверяем (тривиальный вывод не несёт инъекции)
  collect_injection_corpus: false  # копить размеченный корпус (data/injection_corpus.jsonl) под будущий классификатор
checkpointer:
  backend: sqlite
  sqlite_path: data/checkpoints.db
memory:
  db_path: data/memory.db
  recall_k: 5
  reflect_every: 5
  recall_budget_chars: 1800
  embeddings: true              # эмбеддинги памяти вкл (OPEN_ROUTER_API_KEY); recall эмбеддит запрос ОДИН раз
  embedding_model: openai/text-embedding-3-small
  recall_gate: 0.22             # «recall не всегда»: ассоциативная память (эпизоды/выводы) инжектится только если top_score>=gate; персона-факты всегда. 0=выкл гейт
  graph_hops: 1                 # GraphRAG-lite: глубина spreading-activation от релевантных сидов (0=выкл графовый recall)
  graph_decay: 0.6              # затухание буста на хоп
  graph_seed_min: 0.3           # минимальная релевантность узла, чтобы стать сидом графового пула (PII-контейнмент: нерелевантно→не тянем)
  max_episodes: 2000
  max_facts: 300
  max_reflections: 200
  max_recipes: 200              # рецептов на юзера: оставляем самые ценные (победы→использования→свежесть)
skills:
  base_path: src/skills
  protected:
  - web_search
  - code
  - file_operations
  - text_file_processor
  - link_parser
  - uv_package_manager
  - device_control
  - deep_agent
  - app_control
  - ax_control
  - phone_control
  - stash
  - browser_control   # авторский core (физ-браузер, «браузер-first»): без protected AST-гейт
  - launcher          # молча резал __import__/subprocess → навыки были МЕРТВЫ (вскрыто судьями)
  confirm:                   # side-effect навыки: вызов тула требует подтверждения человека (HITL)
  - device_control
  - app_control
  - ax_control
  - phone_control
  - browser_control          # действия в браузере агента (browser_see — read-only, без вопросов)
  - code                     # edit_file/run_bash требуют подтверждения; glob/grep/tree/read — read-only
  dangerous:                 # необратимые/шелл-тулзы: auto-accept НЕ снимает вопрос, только полный auto
  - run_bash                 #   (SEC-1: иначе впрыснутый из веб-контента вызов → RCE без чекпойнта).
  - edit_file                #   Имена ТУЛОВ (не навыков). Дефолт {run_bash, edit_file} зашит в hitl.py.
  autosync: true
  temp_ttl_days: 7           # временные (не принятые в библиотеку) навыки старше TTL чистятся при старте
  curator_min_uses: 5        # куратор: судим навык только после N реальных использований
  curator_win_floor: 0.2     # куратор: win-rate ниже пола → сгенерированный навык вычищается при старте
  distill_from_trajectory: true  # ретроспектива: успешный тяжёлый прогон (5+ tool-вызовов) → дистилляция в навык
  distill_min_tool_calls: 5      # порог «задача стоила навыка» (эвристика Hermes)
mcp:
  auto_trust_discovered: false
  discover_limit: 8
improve:
  auto: false
  optimizer: textgrad
  min_failures: 3
  min_failures_user: 3   # порог неудач ОДНОГО юзера для per-user backward (оптимизация под него)
  measure_before_after: true  # accept промпта только если внутренний прогон ДО/ПОСЛЕ показал улучшение
  idle_seconds: 900
  optimize_core_prompts: false  # системные промпты ключевых нод заморожены (политика);
                                # backward правит только промпты саб-агентов-тулов + few-shots
