[project]
name = "self-extension-agent"
version = "0.1.0"
description = "Self-extending, self-improving personal LangGraph agent"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }   # PolyForm Noncommercial 1.0.0 — некоммерческое использование
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "bm25s>=0.3.9",
    "cloakbrowser>=0.3.31",
    "deepagents>=0.6.8",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "langchain>=1.2.10",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "lightrag-hku>=1.5.2",
    "liteparse>=2.0.7",
    "matplotlib>=3.10.9",
    "omegaconf>=2.3.0",
    "openai>=2.26.0",
    "opendataloader-pdf>=2.4.7",
    "openpyxl>=3.1.5",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.3",
    # macOS-only (AX/keystroke управление окнами). Гейт по платформе — иначе
    # uv sync / pip install ПАДАЕТ на Windows/Linux (pyobjc там не ставится).
    "pyobjc-framework-applicationservices>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2; sys_platform == 'darwin'",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "swebench>=4.1.0",
    "textgrad>=0.1.8",
    "turbovec>=0.7.0",
    "uvicorn>=0.49.0",
    "yml>=0.0.1",
]

[project.scripts]
self-extension-agent = "main:_cli_entry"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
# Кроссплатформенная упаковка в нативный бинарь (.exe/.app/бинарь) — opt-in.
# Установка: `uv sync --group package`; сборка: `python scripts/build_binary.py`.
package = [
    "pyinstaller>=6.11.0",
]
# Нативное десктоп-окно (системный webview, без Electron/Node) — opt-in.
# Установка: `uv sync --group gui`; запуск: `python desktop.py`.
gui = [
    "pywebview>=5.3",
]
