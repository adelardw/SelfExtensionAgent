<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>self-extension</title>
<style>
  /* Палитра и подача — в духе daylightcomputer.com: тёплая бумага, мягкий солнечный
     свет, крупная лёгкая засечная типографика, янтарный акцент, спокойствие. */
  :root{
    --bg:#f3eee2; --panel:#ece5d4; --raise:#f7f3ea; --hover:#e7dfcd; --sel:#e3d8bf;
    --ink:#1d1c12; --dim:#6e6a58; --faint:#9a9684; --line:rgba(29,28,18,.10); --line2:rgba(29,28,18,.16);
    --accent:#cf7d2a; --accent-tx:#b86a1e; --danger:#b3402f;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#191610; --panel:#211d15; --raise:#231f17; --hover:#252017; --sel:#2c2619;
      --ink:#efe8d6; --dim:#9b9480; --faint:#6c6553; --line:rgba(255,247,225,.09); --line2:rgba(255,247,225,.15);
      --accent:#e3a24e; --accent-tx:#eab464; --danger:#e0705a; }
  }
  *{ box-sizing:border-box; }
  ::selection{ background:rgba(207,125,42,.26); }
  ::-webkit-scrollbar{ width:10px; } ::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:10px;
    border:3px solid transparent; background-clip:padding-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14.5px; letter-spacing:-.006em; -webkit-font-smoothing:antialiased; }
  /* мягкий солнечный свет (как через окно) — один тёплый слой, очень деликатно */
  body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(70% 55% at 82% -8%, rgba(255,236,200,.55), transparent 60%),
      linear-gradient(122deg, transparent 40%, rgba(255,248,232,.40) 52%, transparent 64%); }
  @media (prefers-color-scheme: dark){ body::before{
      background:radial-gradient(70% 55% at 82% -8%, rgba(227,162,78,.14), transparent 60%); } }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  .shell{ display:grid; grid-template-columns:246px 1fr; height:100vh; }

  /* ── Sidebar ── */
  aside{ background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .brand{ display:flex; align-items:center; gap:10px; padding:18px 18px 14px; }
  .mark{ width:22px; height:22px; border-radius:7px; flex:none; background:var(--accent); display:grid; place-items:center;
    color:#fff; font-size:12px; }
  .brand b{ font-family:var(--serif); font-size:16px; font-weight:500; letter-spacing:.01em; }
  .brand .v{ margin-left:auto; color:var(--faint); font-size:10.5px; font-family:var(--mono); }
  .newbtn{ margin:0 13px 16px; padding:9px 12px; display:flex; align-items:center; gap:9px; background:var(--raise);
    color:var(--ink); border:1px solid var(--line2); border-radius:9px; font-size:13px; font-weight:500; transition:.14s; }
  .newbtn:hover{ border-color:var(--accent); }
  .newbtn kbd{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint); }
  .seclabel{ padding:6px 19px 7px; color:var(--faint); font-size:11px; font-weight:600; letter-spacing:.02em; }
  .threads{ flex:1; overflow-y:auto; padding:0 9px 12px; min-height:0; }
  .thread{ position:relative; padding:8px 28px 8px 13px; border-radius:8px; cursor:pointer; color:var(--dim);
    font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:.11s; margin:1px 0; }
  .thread:hover{ background:var(--hover); color:var(--ink); }
  .thread.active{ background:var(--sel); color:var(--ink); }
  .thread .star{ color:var(--accent); font-size:10px; margin-right:6px; }
  .thread .del{ position:absolute; right:6px; top:50%; transform:translateY(-50%); opacity:0; border:0; background:transparent;
    color:var(--faint); padding:3px 5px; border-radius:5px; font-size:11px; transition:.1s; }
  .thread:hover .del{ opacity:1; } .thread .del:hover{ color:var(--danger); }
  .empty-list{ padding:10px 19px; color:var(--faint); font-size:12.5px; }
  .sidefoot{ padding:11px 19px; border-top:1px solid var(--line); color:var(--faint); font-size:11px; font-family:var(--mono);
    display:flex; align-items:center; gap:7px; }
  .sidefoot .led{ width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .sidefoot .led.on{ background:#7fae5a; }

  /* ── Main ── */
  main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
  .topbar{ height:54px; display:flex; align-items:center; gap:10px; padding:0 28px; border-bottom:1px solid var(--line); }
  .topbar .title{ font-family:var(--serif); font-size:16px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar .chip{ margin-left:auto; font-size:11px; font-family:var(--mono); color:var(--dim); }
  .scroll{ flex:1; overflow-y:auto; min-height:0; }
  .col{ max-width:716px; margin:0 auto; padding:36px 28px 10px; }

  .turn{ padding:0 0 32px; animation:fade .25s ease both; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .rolehdr{ font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); margin-bottom:11px; }
  .turn.bot .rolehdr{ color:var(--accent-tx); }
  .body{ line-height:1.74; font-size:15px; word-wrap:break-word; }
  .body p{ margin:0 0 13px; } .body p:last-child{ margin-bottom:0; }
  .body h1,.body h2,.body h3{ font-family:var(--serif); margin:20px 0 9px; line-height:1.3; font-weight:500; letter-spacing:0; }
  .body h1{ font-size:1.45em; } .body h2{ font-size:1.28em; } .body h3{ font-size:1.12em; }
  .body ul,.body ol{ margin:10px 0; padding-left:21px; } .body li{ margin:5px 0; }
  .body a{ color:var(--accent-tx); text-decoration:none; border-bottom:1px solid rgba(207,125,42,.4); }
  .body a:hover{ border-color:var(--accent); }
  .body code{ font-family:var(--mono); font-size:.84em; background:var(--panel); border:1px solid var(--line);
    padding:1px 5px; border-radius:5px; }
  .body pre{ background:var(--raise); border:1px solid var(--line2); border-radius:9px; padding:14px 16px; overflow-x:auto;
    margin:13px 0; } .body pre code{ background:none; border:0; padding:0; font-size:12.5px; line-height:1.6; }
  .meta{ margin-top:16px; padding-top:13px; border-top:1px solid var(--line); display:flex; gap:15px; flex-wrap:wrap; }
  .meta .tag{ color:var(--faint); font-size:11px; font-family:var(--mono); }
  .dots span{ display:inline-block; width:5px; height:5px; margin-right:5px; border-radius:50%; background:var(--accent);
    animation:bl 1.2s infinite both; } .dots span:nth-child(2){ animation-delay:.2s; } .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes bl{ 0%,80%,100%{ opacity:.3; } 40%{ opacity:1; } }

  /* welcome — крупная лёгкая засечная типографика как герой */
  .hero{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .hero .bigmark{ width:38px; height:38px; border-radius:10px; background:var(--accent); display:grid; place-items:center;
    color:#fff; font-size:18px; margin-bottom:30px; box-shadow:0 6px 22px rgba(207,125,42,.28); }
  .hero h2{ font-family:var(--serif); margin:0; font-size:52px; font-weight:400; letter-spacing:-.01em; line-height:1.04; }
  .hero h2 i{ font-style:italic; color:var(--accent-tx); }
  .hero p{ margin:18px 0 0; color:var(--dim); font-size:15.5px; max-width:430px; line-height:1.6; }
  .chips{ display:flex; flex-direction:column; gap:9px; margin-top:36px; width:100%; max-width:430px; }
  .pchip{ background:var(--raise); border:1px solid var(--line2); color:var(--dim); padding:12px 16px; border-radius:10px;
    font-size:13.5px; text-align:left; transition:.14s; }
  .pchip:hover{ color:var(--ink); border-color:var(--accent); }

  /* composer */
  .composer{ padding:14px 28px 22px; }
  .cwrap{ max-width:716px; margin:0 auto; display:flex; align-items:flex-end; gap:10px; background:var(--raise);
    border:1px solid var(--line2); border-radius:13px; padding:9px 9px 9px 16px; transition:border-color .14s; }
  .cwrap:focus-within{ border-color:var(--accent); }
  #q{ flex:1; resize:none; border:0; background:transparent; color:var(--ink); font:inherit; font-size:14.5px; line-height:1.5;
    max-height:200px; padding:6px 0; } #q:focus{ outline:none; } #q::placeholder{ color:var(--faint); }
  #send{ width:31px; height:31px; flex:none; border:0; border-radius:8px; background:var(--accent); color:#fff;
    display:grid; place-items:center; transition:.14s; }
  #send:hover:not(:disabled){ filter:brightness(1.07); } #send:disabled{ background:var(--line2); color:var(--faint); }
  #send svg{ width:15px; height:15px; }
  .hint{ max-width:716px; margin:9px auto 0; color:var(--faint); font-size:11px; text-align:center; font-family:var(--mono); }
  .menu-btn{ display:none; }
  @media (max-width:760px){
    .shell{ grid-template-columns:1fr; }
    aside{ position:fixed; z-index:20; width:246px; height:100%; transform:translateX(-100%); transition:.2s; }
    aside.open{ transform:none; }
    .menu-btn{ display:grid; place-items:center; width:32px; height:32px; border:1px solid var(--line2); border-radius:8px; background:var(--raise); }
    .hero h2{ font-size:38px; } .col{ padding:24px 20px 10px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="aside">
    <div class="brand"><span class="mark">✦</span><b>self&#8209;extension</b><span class="v">0.2</span></div>
    <button class="newbtn" id="newchat">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Новый чат <kbd>⌘N</kbd>
    </button>
    <div class="seclabel">История</div>
    <div class="threads" id="threads"><div class="empty-list">пока пусто</div></div>
    <div class="sidefoot"><span class="led" id="led"></span><span id="status">подключение…</span></div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-btn" id="menu">☰</button>
      <span class="title" id="title">Новый чат</span>
      <span class="chip" id="chip" style="display:none"></span>
    </div>
    <div class="scroll" id="scroll"><div class="col" id="log"></div></div>
    <div class="composer">
      <div class="cwrap">
        <textarea id="q" rows="1" placeholder="Сообщение агенту…"></textarea>
        <button id="send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — перенос</div>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const log=$('#log'), scroll=$('#scroll'), q=$('#q'), send=$('#send'), threadsEl=$('#threads'),
  titleEl=$('#title'), chip=$('#chip'), led=$('#led'), statusEl=$('#status'), aside=$('#aside');
const uid = (()=>{ let u=localStorage.getItem('agent_uid'); if(!u){u='gui-'+Math.random().toString(36).slice(2,10);localStorage.setItem('agent_uid',u);} return u; })();
let curThread=null, busy=false;
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 't-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(s){
  s = esc(s);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s = s.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g,(m,b)=>'\n<ul>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,b)=>'\n<ol>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
  return s.split(/\n{2,}/).map(p=>/^\s*<(h\d|ul|ol|pre)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
const atBottom = ()=> scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight < 80;
function toBottom(f){ if(f||atBottom()) scroll.scrollTop=scroll.scrollHeight; }
function turnEl(role, html){
  const r=document.createElement('div'); r.className='turn '+(role==='user'?'me':'bot');
  r.innerHTML=`<div class="rolehdr">${role==='user'?'Ты':'Агент'}</div><div class="body">${html}</div>`;
  log.appendChild(r); return r;
}
function showHero(){
  log.innerHTML=`<div class="hero"><div class="bigmark">✦</div><h2>Чем <i>помочь</i>?</h2>
    <p>Спрошу, поищу, посчитаю, открою в браузере — и запомню тебя.</p>
    <div class="chips">
      <button class="pchip">Сравни 3 ноутбука до 100к и посоветуй</button>
      <button class="pchip">Объясни attention в трансформере со ссылками</button>
      <button class="pchip">Посчитай сложный процент по вкладу</button>
    </div></div>`;
  log.querySelectorAll('.pchip').forEach(b=> b.onclick=()=>{ q.value=b.textContent; resize(); ask(); });
}
async function loadThreads(){
  let items=[]; try{ items=await (await fetch('/chats?user_id='+uid)).json(); }catch{}
  if(!items.length){ threadsEl.innerHTML='<div class="empty-list">пока пусто</div>'; return; }
  threadsEl.innerHTML='';
  for(const t of items){
    const d=document.createElement('div'); d.className='thread'+(t.thread_id===curThread?' active':''); d.title=t.title||'';
    d.innerHTML=(t.favorite?'<span class="star">★</span>':'')+esc(t.title||'без названия')+'<button class="del" title="удалить">✕</button>';
    d.onclick=e=>{ if(e.target.classList.contains('del'))return; openThread(t.thread_id); };
    d.querySelector('.del').onclick=async e=>{ e.stopPropagation(); await fetch('/chats/'+t.thread_id,{method:'DELETE'});
      if(t.thread_id===curThread) newChat(); else loadThreads(); };
    threadsEl.appendChild(d);
  }
}
async function openThread(id){
  curThread=id; aside.classList.remove('open');
  let data={messages:[],thread:null}; try{ data=await (await fetch('/chats/'+id)).json(); }catch{}
  titleEl.textContent=(data.thread&&data.thread.title)||'Чат'; log.innerHTML='';
  if(!data.messages.length) showHero();
  else for(const m of data.messages) turnEl(m.role==='user'?'user':'bot', m.role==='user'?esc(m.content):fmt(m.content));
  loadThreads(); toBottom(true); q.focus();
}
function newChat(){ curThread=uuid(); titleEl.textContent='Новый чат'; chip.style.display='none'; showHero(); loadThreads(); q.focus(); }
async function ask(){
  const text=q.value.trim(); if(!text||busy)return; busy=true; send.disabled=true;
  if(log.querySelector('.hero')) log.innerHTML='';
  q.value=''; resize(); turnEl('user', esc(text)); toBottom(true);
  const bot=turnEl('bot','<span class="dots"><span></span><span></span><span></span></span>'); const body=bot.querySelector('.body');
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:uid,thread_id:curThread,query:text})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json(); const tags=[];
    if(d.mode)tags.push('режим '+d.mode); if(d.aim)tags.push('цель: '+d.aim);
    if(d.active_tools&&d.active_tools.length)tags.push(d.active_tools.join(' · '));
    body.innerHTML=fmt(d.answer||'(пустой ответ)')+(tags.length?'<div class="meta">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'');
    if(d.mode){ chip.textContent=d.mode; chip.style.display=''; } if(d.title) titleEl.textContent=d.title; loadThreads();
  }catch(e){ body.innerHTML='<p style="color:var(--danger)">ошибка: '+esc(String(e.message||e))+'</p>'; }
  finally{ busy=false; send.disabled=q.value.trim()===''; toBottom(); q.focus(); }
}
async function ping(){ try{ await fetch('/chats?user_id='+uid); led.classList.add('on'); statusEl.textContent=uid; }
  catch{ led.classList.remove('on'); statusEl.textContent='offline'; } }
function resize(){ q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,200)+'px'; }
$('#newchat').onclick=newChat; $('#menu').onclick=()=>aside.classList.toggle('open'); send.onclick=ask;
q.addEventListener('input',()=>{ resize(); send.disabled=q.value.trim()===''; });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(); }});
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){ e.preventDefault(); newChat(); }});
newChat(); ping(); setInterval(ping,15000);
</script>
</body>
</html>
