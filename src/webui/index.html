<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>self-extension-agent</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e9ef; --dim:#8b93a1; --accent:#6aa3ff; --user:#243044; --ok:#54d18c;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  #app { display:flex; flex-direction:column; height:100vh; max-width:920px; margin:0 auto; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:10px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  header .dot.on { background:var(--ok); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px; }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:86%; padding:10px 14px; border-radius:12px; white-space:pre-wrap;
    word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line);
    border-bottom-left-radius:4px; }
  .msg.bot pre { background:#0b0d11; padding:10px; border-radius:8px; overflow-x:auto;
    border:1px solid var(--line); }
  .msg.bot code { background:#0b0d11; padding:1px 5px; border-radius:5px; }
  .meta { color:var(--dim); font-size:11.5px; margin-top:7px; display:flex; gap:10px;
    flex-wrap:wrap; }
  .meta .tag { background:var(--panel2); padding:1px 7px; border-radius:6px; }
  .typing { color:var(--dim); font-style:italic; }
  footer { border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; }
  #q { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:11px 13px; font:inherit; max-height:160px; }
  #q:focus { outline:none; border-color:var(--accent); }
  #send { background:var(--accent); color:#06101f; border:0; border-radius:10px; padding:0 18px;
    font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
  .err { color:#ff7b7b; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot" id="dot"></span>
    <h1>self-extension-agent</h1>
    <span class="sub" id="status">подключение…</span>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="q" rows="1" placeholder="Спроси что-нибудь…  (Enter — отправить, Shift+Enter — перенос)"></textarea>
    <button id="send">→</button>
  </footer>
</div>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
// постоянный id пользователя в этом браузере → долгая память агента работает между сессиями
let uid = localStorage.getItem('agent_uid');
if (!uid) { uid = 'gui-' + Math.random().toString(36).slice(2,10); localStorage.setItem('agent_uid', uid); }

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
// минимальный markdown без внешних либ (работает офлайн/в упакованном бинаре)
function fmt(s){
  s = esc(s);
  s = s.replace(/```([\s\S]*?)```/g, (_,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" style="color:var(--accent)">$1</a>');
  return s;
}
function addMsg(role, html){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
async function ping(){
  try { await fetch('/memory/goal?user_id='+uid); dot.classList.add('on'); statusEl.textContent='готов'; }
  catch { dot.classList.remove('on'); statusEl.textContent='сервер недоступен'; }
}
async function ask(){
  const text = q.value.trim();
  if (!text) return;
  q.value = ''; q.style.height='auto';
  addMsg('user', esc(text));
  send.disabled = true;
  const bot = addMsg('bot', '<span class="typing">думаю…</span>');
  try {
    const res = await fetch('/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: uid, query: text})
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const d = await res.json();
    let meta = '';
    const tags = [];
    if (d.mode) tags.push('режим: '+d.mode);
    if (d.aim) tags.push('цель: '+d.aim);
    if (d.active_tools && d.active_tools.length) tags.push('инструменты: '+d.active_tools.join(', '));
    if (tags.length) meta = '<div class="meta">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
    bot.innerHTML = fmt(d.answer || '(пустой ответ)') + meta;
  } catch (e) {
    bot.innerHTML = '<span class="err">ошибка: '+esc(String(e.message||e))+'</span>';
  } finally {
    send.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
  }
}
send.onclick = ask;
q.addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});
q.addEventListener('input', () => { q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,160)+'px'; });
ping(); setInterval(ping, 15000); q.focus();
</script>
</body>
</html>
