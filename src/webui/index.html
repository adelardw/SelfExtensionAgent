<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>self-extension</title>
<style>
  :root{
    --bg:#0a0b0d; --sidebar:#0d0e11; --panel:#15161a; --hover:#191b20; --sel:#1d1f26;
    --line:#1c1e24; --line2:#262931; --text:#e9eaed; --dim:#8b8e97; --faint:#565963;
    --accent:#7c6ff5; --accent2:#9d8cff; --ink:#0a0b0d; --danger:#f0616d;
    --r:7px; --r2:10px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#ffffff; --sidebar:#fbfbfc; --panel:#f5f5f7; --hover:#efeff2; --sel:#eaeaee;
      --line:#e9e9ec; --line2:#dddde2; --text:#16171b; --dim:#6a6d75; --faint:#9b9ea5; --ink:#fff; }
  }
  *{ box-sizing:border-box; }
  ::selection{ background:rgba(124,111,245,.28); }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:14.5px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  .shell{ display:grid; grid-template-columns:248px 1fr; height:100vh; }

  /* ── Sidebar ── */
  aside{ background:var(--sidebar); border-right:1px solid var(--line); display:flex;
    flex-direction:column; min-height:0; }
  .brand{ display:flex; align-items:center; gap:9px; padding:15px 16px 12px; }
  .mark{ width:20px; height:20px; border-radius:6px; flex:none;
    background:linear-gradient(145deg,var(--accent),var(--accent2)); display:grid; place-items:center;
    color:#fff; font-size:11px; box-shadow:0 0 0 1px rgba(124,111,245,.35),0 2px 8px rgba(124,111,245,.25); }
  .brand b{ font-size:13.5px; font-weight:600; }
  .brand .v{ margin-left:auto; color:var(--faint); font-size:10.5px; font-family:var(--mono); }
  .newbtn{ margin:0 12px 10px; padding:8px 11px; display:flex; align-items:center; gap:8px;
    background:transparent; color:var(--text); border:1px solid var(--line2); border-radius:var(--r);
    font-size:13px; font-weight:500; transition:border-color .14s,background .14s; }
  .newbtn:hover{ border-color:var(--accent); background:var(--hover); }
  .newbtn kbd{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint);
    border:1px solid var(--line2); border-radius:4px; padding:0 4px; }
  .seclabel{ padding:8px 16px 4px; color:var(--faint); font-size:10.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:.09em; }
  .threads{ flex:1; overflow-y:auto; padding:0 8px 10px; min-height:0; }
  .thread{ position:relative; padding:7px 26px 7px 13px; border-radius:var(--r); cursor:pointer;
    color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .12s,background .12s; margin:1px 0; }
  .thread::before{ content:""; position:absolute; left:3px; top:50%; transform:translateY(-50%);
    width:2px; height:0; background:var(--accent); border-radius:2px; transition:height .14s; }
  .thread:hover{ background:var(--hover); color:var(--text); }
  .thread.active{ background:var(--sel); color:var(--text); }
  .thread.active::before{ height:14px; }
  .thread .star{ color:var(--accent); font-size:10px; margin-right:5px; }
  .thread .del{ position:absolute; right:5px; top:50%; transform:translateY(-50%); opacity:0;
    border:0; background:transparent; color:var(--faint); padding:3px 5px; border-radius:5px;
    font-size:12px; transition:.12s; }
  .thread:hover .del{ opacity:1; } .thread .del:hover{ color:var(--danger); background:var(--hover); }
  .empty-list{ padding:12px 16px; color:var(--faint); font-size:12.5px; }
  .sidefoot{ padding:9px 16px; border-top:1px solid var(--line); color:var(--faint); font-size:11px;
    font-family:var(--mono); display:flex; align-items:center; gap:7px; }
  .sidefoot .led{ width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .sidefoot .led.on{ background:#46d39a; box-shadow:0 0 6px rgba(70,211,154,.7); }

  /* ── Main ── */
  main{ display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  main::before{ content:""; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,111,245,.5),transparent); }
  .topbar{ height:48px; display:flex; align-items:center; gap:10px; padding:0 20px;
    border-bottom:1px solid var(--line); }
  .topbar .title{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar .chip{ margin-left:auto; color:var(--accent2); font-size:11px; font-family:var(--mono);
    border:1px solid var(--line2); padding:2px 8px; border-radius:5px; }
  .scroll{ flex:1; overflow-y:auto; min-height:0; }
  .col{ max-width:740px; margin:0 auto; padding:24px 24px 8px; }

  .turn{ padding:16px 0; border-bottom:1px solid var(--line); }
  .turn:last-child{ border-bottom:0; }
  .rolehdr{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .rolehdr .sq{ width:18px; height:18px; border-radius:5px; flex:none; display:grid; place-items:center;
    font-size:10px; font-weight:700; }
  .sq.bot{ background:linear-gradient(145deg,var(--accent),var(--accent2)); color:#fff;
    box-shadow:0 0 0 1px rgba(124,111,245,.3); }
  .sq.me{ background:var(--panel); border:1px solid var(--line2); color:var(--dim); }
  .rname{ font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); }
  .body{ line-height:1.66; word-wrap:break-word; }
  .body p{ margin:0 0 11px; } .body p:last-child{ margin-bottom:0; }
  .body h1,.body h2,.body h3{ margin:15px 0 8px; line-height:1.3; font-weight:650; }
  .body h1{ font-size:1.22em; } .body h2{ font-size:1.12em; } .body h3{ font-size:1.02em; }
  .body ul,.body ol{ margin:8px 0; padding-left:20px; } .body li{ margin:3px 0; }
  .body a{ color:var(--accent2); text-decoration:none; border-bottom:1px solid rgba(157,140,255,.35); }
  .body a:hover{ border-color:var(--accent2); }
  .body code{ font-family:var(--mono); font-size:.86em; background:var(--panel); border:1px solid var(--line);
    padding:1px 5px; border-radius:5px; }
  .body pre{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:13px 15px;
    overflow-x:auto; margin:10px 0; } .body pre code{ background:none; border:0; padding:0; font-size:12.5px; line-height:1.5; }
  .meta{ margin-top:11px; display:flex; gap:6px; flex-wrap:wrap; }
  .meta .tag{ color:var(--faint); font-size:10.5px; font-family:var(--mono); border:1px solid var(--line);
    padding:1.5px 7px; border-radius:5px; }
  .dots span{ display:inline-block; width:5px; height:5px; margin-right:5px; border-radius:50%;
    background:var(--accent2); animation:bl 1.1s infinite both; }
  .dots span:nth-child(2){ animation-delay:.18s; } .dots span:nth-child(3){ animation-delay:.36s; }
  @keyframes bl{ 0%,80%,100%{ opacity:.2; transform:translateY(0);} 40%{ opacity:1; transform:translateY(-2px);} }

  /* welcome */
  .hero{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; gap:14px; }
  .hero .bigmark{ width:40px; height:40px; border-radius:11px; background:linear-gradient(145deg,var(--accent),var(--accent2));
    display:grid; place-items:center; color:#fff; font-size:19px;
    box-shadow:0 0 0 1px rgba(124,111,245,.3),0 6px 24px rgba(124,111,245,.3); }
  .hero h2{ margin:6px 0 0; font-size:21px; font-weight:650; letter-spacing:-.02em; }
  .hero p{ margin:0; color:var(--dim); font-size:13.5px; }
  .chips{ display:flex; flex-direction:column; gap:7px; margin-top:8px; width:100%; max-width:380px; }
  .pchip{ background:transparent; border:1px solid var(--line2); color:var(--text); padding:10px 14px;
    border-radius:var(--r); font-size:13px; text-align:left; transition:.14s; display:flex; gap:9px; align-items:center; }
  .pchip:hover{ border-color:var(--accent); background:var(--hover); }
  .pchip::before{ content:"→"; color:var(--faint); font-family:var(--mono); }

  /* composer */
  .composer{ padding:10px 24px 18px; }
  .cwrap{ max-width:740px; margin:0 auto; display:flex; align-items:flex-end; gap:9px; background:var(--panel);
    border:1px solid var(--line2); border-radius:var(--r2); padding:8px 8px 8px 14px; transition:border-color .14s; }
  .cwrap:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,111,245,.12); }
  #q{ flex:1; resize:none; border:0; background:transparent; color:var(--text); font:inherit; line-height:1.5;
    max-height:200px; padding:6px 0; } #q:focus{ outline:none; }
  #q::placeholder{ color:var(--faint); }
  #send{ width:30px; height:30px; flex:none; border:0; border-radius:7px;
    background:linear-gradient(145deg,var(--accent),var(--accent2)); color:#fff; display:grid; place-items:center; transition:.14s; }
  #send:disabled{ background:var(--line2); color:var(--faint); }
  #send svg{ width:16px; height:16px; }
  .hint{ max-width:740px; margin:8px auto 0; color:var(--faint); font-size:11px; text-align:center;
    font-family:var(--mono); }
  .hint kbd{ border:1px solid var(--line2); border-radius:4px; padding:0 4px; }
  .menu-btn{ display:none; }
  @media (max-width:760px){
    .shell{ grid-template-columns:1fr; }
    aside{ position:fixed; z-index:20; width:248px; height:100%; transform:translateX(-100%); transition:.2s; }
    aside.open{ transform:none; box-shadow:0 0 40px rgba(0,0,0,.5); }
    .menu-btn{ display:grid; place-items:center; width:32px; height:32px; border:1px solid var(--line2);
      border-radius:6px; background:transparent; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="aside">
    <div class="brand"><span class="mark">✦</span><b>self&#8209;extension</b><span class="v">v0.2</span></div>
    <button class="newbtn" id="newchat">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Новый чат <kbd>⌘N</kbd>
    </button>
    <div class="seclabel">История</div>
    <div class="threads" id="threads"><div class="empty-list">пока пусто</div></div>
    <div class="sidefoot"><span class="led" id="led"></span><span id="status">подключение…</span></div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-btn" id="menu">☰</button>
      <span class="title" id="title">Новый чат</span>
      <span class="chip" id="chip" style="display:none"></span>
    </div>
    <div class="scroll" id="scroll"><div class="col" id="log"></div></div>
    <div class="composer">
      <div class="cwrap">
        <textarea id="q" rows="1" placeholder="Сообщение агенту…"></textarea>
        <button id="send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="hint"><kbd>Enter</kbd> отправить · <kbd>⇧Enter</kbd> перенос</div>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const log=$('#log'), scroll=$('#scroll'), q=$('#q'), send=$('#send'), threadsEl=$('#threads'),
  titleEl=$('#title'), chip=$('#chip'), led=$('#led'), statusEl=$('#status'), aside=$('#aside');
const uid = (()=>{ let u=localStorage.getItem('agent_uid'); if(!u){u='gui-'+Math.random().toString(36).slice(2,10);localStorage.setItem('agent_uid',u);} return u; })();
let curThread=null, busy=false;
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 't-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(s){
  s = esc(s);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s = s.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g,(m,b)=>'\n<ul>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,b)=>'\n<ol>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
  return s.split(/\n{2,}/).map(p=>/^\s*<(h\d|ul|ol|pre)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
const atBottom = ()=> scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight < 80;
function toBottom(f){ if(f||atBottom()) scroll.scrollTop=scroll.scrollHeight; }
function turnEl(role, html){
  const r=document.createElement('div'); r.className='turn '+(role==='user'?'me':'bot');
  r.innerHTML=`<div class="rolehdr"><span class="sq ${role==='user'?'me':'bot'}">${role==='user'?'Я':'✦'}</span>`+
    `<span class="rname">${role==='user'?'Ты':'Агент'}</span></div><div class="body">${html}</div>`;
  log.appendChild(r); return r;
}
function showHero(){
  log.innerHTML=`<div class="hero"><div class="bigmark">✦</div><h2>Чем помочь?</h2>
    <p>Спрошу, поищу, посчитаю, открою в браузере — и запомню тебя.</p>
    <div class="chips">
      <button class="pchip">Сравни 3 ноутбука до 100к и посоветуй</button>
      <button class="pchip">Объясни attention в трансформере со ссылками</button>
      <button class="pchip">Посчитай сложный процент по вкладу</button>
    </div></div>`;
  log.querySelectorAll('.pchip').forEach(b=> b.onclick=()=>{ q.value=b.textContent; resize(); ask(); });
}
async function loadThreads(){
  let items=[]; try{ items=await (await fetch('/chats?user_id='+uid)).json(); }catch{}
  if(!items.length){ threadsEl.innerHTML='<div class="empty-list">пока пусто</div>'; return; }
  threadsEl.innerHTML='';
  for(const t of items){
    const d=document.createElement('div'); d.className='thread'+(t.thread_id===curThread?' active':''); d.title=t.title||'';
    d.innerHTML=(t.favorite?'<span class="star">★</span>':'')+esc(t.title||'без названия')+'<button class="del" title="удалить">✕</button>';
    d.onclick=e=>{ if(e.target.classList.contains('del'))return; openThread(t.thread_id); };
    d.querySelector('.del').onclick=async e=>{ e.stopPropagation(); await fetch('/chats/'+t.thread_id,{method:'DELETE'});
      if(t.thread_id===curThread) newChat(); else loadThreads(); };
    threadsEl.appendChild(d);
  }
}
async function openThread(id){
  curThread=id; aside.classList.remove('open');
  let data={messages:[],thread:null}; try{ data=await (await fetch('/chats/'+id)).json(); }catch{}
  titleEl.textContent=(data.thread&&data.thread.title)||'Чат'; log.innerHTML='';
  if(!data.messages.length) showHero();
  else for(const m of data.messages) turnEl(m.role==='user'?'user':'bot', m.role==='user'?esc(m.content):fmt(m.content));
  loadThreads(); toBottom(true); q.focus();
}
function newChat(){ curThread=uuid(); titleEl.textContent='Новый чат'; chip.style.display='none'; showHero(); loadThreads(); q.focus(); }
async function ask(){
  const text=q.value.trim(); if(!text||busy)return; busy=true; send.disabled=true;
  if(log.querySelector('.hero')) log.innerHTML='';
  q.value=''; resize(); turnEl('user', esc(text)); toBottom(true);
  const bot=turnEl('bot','<span class="dots"><span></span><span></span><span></span></span>'); const body=bot.querySelector('.body');
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:uid,thread_id:curThread,query:text})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json(); const tags=[];
    if(d.mode)tags.push('режим '+d.mode); if(d.aim)tags.push('цель: '+d.aim);
    if(d.active_tools&&d.active_tools.length)tags.push(d.active_tools.join(' · '));
    body.innerHTML=fmt(d.answer||'(пустой ответ)')+(tags.length?'<div class="meta">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'');
    if(d.mode){ chip.textContent=d.mode; chip.style.display=''; } if(d.title) titleEl.textContent=d.title; loadThreads();
  }catch(e){ body.innerHTML='<p style="color:var(--danger)">ошибка: '+esc(String(e.message||e))+'</p>'; }
  finally{ busy=false; send.disabled=q.value.trim()===''; toBottom(); q.focus(); }
}
async function ping(){ try{ await fetch('/chats?user_id='+uid); led.classList.add('on'); statusEl.textContent=uid; }
  catch{ led.classList.remove('on'); statusEl.textContent='offline'; } }
function resize(){ q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,200)+'px'; }
$('#newchat').onclick=newChat; $('#menu').onclick=()=>aside.classList.toggle('open'); send.onclick=ask;
q.addEventListener('input',()=>{ resize(); send.disabled=q.value.trim()===''; });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(); }});
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){ e.preventDefault(); newChat(); }});
newChat(); ping(); setInterval(ping,15000);
</script>
</body>
</html>
