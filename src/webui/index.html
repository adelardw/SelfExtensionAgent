<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>self-extension</title>
<style>
  /* Строгий монохром, острые углы, точная сетка, максимум воздуха. Ноль
     градиентов / теней / текстур / засечек — аккуратность за счёт сетки и типографики. */
  :root{
    --bg:#0b0b0c; --side:#0f0f10; --panel:#151517; --hover:#161618; --sel:#1d1d20;
    --text:#ededee; --dim:#84858b; --faint:#55565c;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12); --line3:rgba(255,255,255,.2);
    --inv:#ededee; --inv-tx:#0b0b0c; --accent:#878b94;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r:4px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#ffffff; --side:#fbfbfb; --panel:#f5f5f5; --hover:#f4f4f4; --sel:#ededed;
      --text:#111113; --dim:#6c6d72; --faint:#9a9b9f;
      --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.13); --line3:rgba(0,0,0,.22);
      --inv:#111113; --inv-tx:#fff; --accent:#6c6d72; }
  }
  *{ box-sizing:border-box; }
  ::selection{ background:rgba(130,135,145,.3); }
  ::-webkit-scrollbar{ width:9px; } ::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:0;
    border:3px solid transparent; background-clip:padding-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:13.5px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  .shell{ display:grid; grid-template-columns:240px 1fr; height:100vh; }

  /* ── Sidebar ── */
  aside{ background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .brand{ display:flex; align-items:center; gap:9px; height:53px; padding:0 18px; border-bottom:1px solid var(--line); }
  .mark{ width:18px; height:18px; border-radius:var(--r); flex:none; background:var(--inv); color:var(--inv-tx);
    display:grid; place-items:center; font-size:10px; font-weight:700; }
  .brand b{ font-size:13px; font-weight:580; letter-spacing:-.02em; }
  .brand .v{ margin-left:auto; color:var(--faint); font-size:10px; font-family:var(--mono); }
  .newbtn{ margin:14px 14px 18px; padding:8px 11px; display:flex; align-items:center; gap:8px; background:transparent;
    color:var(--dim); border:1px solid var(--line2); border-radius:var(--r); font-size:12.5px; font-weight:500; transition:.12s; }
  .newbtn:hover{ color:var(--text); border-color:var(--line3); }
  .newbtn kbd{ margin-left:auto; font-family:var(--mono); font-size:9.5px; color:var(--faint); }
  .seclabel{ padding:0 18px 9px; color:var(--faint); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
  .threads{ flex:1; overflow-y:auto; padding:0 10px 14px; min-height:0; }
  .thread{ position:relative; padding:7px 26px 7px 10px; border-radius:var(--r); cursor:pointer; color:var(--dim);
    font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:.1s; }
  .thread:hover{ background:var(--hover); color:var(--text); }
  .thread.active{ background:var(--sel); color:var(--text); }
  .thread .star{ color:var(--dim); font-size:9px; margin-right:6px; }
  .thread .del{ position:absolute; right:5px; top:50%; transform:translateY(-50%); opacity:0; border:0; background:transparent;
    color:var(--faint); padding:3px 5px; border-radius:var(--r); font-size:11px; transition:.1s; }
  .thread:hover .del{ opacity:1; } .thread .del:hover{ color:var(--text); }
  .empty-list{ padding:8px 10px; color:var(--faint); font-size:12px; }
  .sidefoot{ padding:11px 18px; border-top:1px solid var(--line); color:var(--faint); font-size:10.5px; font-family:var(--mono);
    display:flex; align-items:center; gap:7px; }
  .sidefoot .led{ width:5px; height:5px; border-radius:50%; background:var(--faint); }
  .sidefoot .led.on{ background:var(--dim); }

  /* ── Main ── */
  main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
  .topbar{ height:53px; display:flex; align-items:center; gap:10px; padding:0 32px; border-bottom:1px solid var(--line); }
  .topbar .title{ font-size:13px; font-weight:560; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar .chip{ margin-left:auto; font-size:10.5px; font-family:var(--mono); color:var(--faint); }
  .scroll{ flex:1; overflow-y:auto; min-height:0; }
  .col{ max-width:700px; margin:0 auto; padding:40px 32px 12px; }

  .turn{ padding:0 0 34px; }
  .rolehdr{ font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin-bottom:12px; }
  .body{ line-height:1.75; font-size:14px; color:var(--text); word-wrap:break-word; }
  .body p{ margin:0 0 13px; } .body p:last-child{ margin-bottom:0; }
  .body h1,.body h2,.body h3{ margin:22px 0 9px; line-height:1.35; font-weight:600; letter-spacing:-.015em; }
  .body h1{ font-size:1.18em; } .body h2{ font-size:1.08em; } .body h3{ font-size:1em; }
  .body ul,.body ol{ margin:11px 0; padding-left:20px; } .body li{ margin:5px 0; }
  .body a{ color:var(--text); text-decoration:none; border-bottom:1px solid var(--line3); }
  .body a:hover{ border-color:var(--text); }
  .body code{ font-family:var(--mono); font-size:.84em; background:var(--panel); border:1px solid var(--line); padding:1px 5px; border-radius:3px; }
  .body pre{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; overflow-x:auto;
    margin:13px 0; } .body pre code{ background:none; border:0; padding:0; font-size:12.5px; line-height:1.6; }
  .meta{ margin-top:17px; padding-top:14px; border-top:1px solid var(--line); display:flex; gap:16px; flex-wrap:wrap; }
  .meta .tag{ color:var(--faint); font-size:10.5px; font-family:var(--mono); }
  .dots span{ display:inline-block; width:4px; height:4px; margin-right:5px; border-radius:50%; background:var(--dim);
    animation:bl 1.2s infinite both; } .dots span:nth-child(2){ animation-delay:.2s; } .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes bl{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  /* welcome — сдержанно, без украшений */
  .hero{ height:100%; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:0 32px; max-width:700px; margin:0 auto; width:100%; }
  .hero .bigmark{ width:26px; height:26px; border-radius:var(--r); background:var(--inv); color:var(--inv-tx); display:grid; place-items:center; font-size:13px; font-weight:700; margin-bottom:22px; }
  .hero h2{ margin:0; font-size:27px; font-weight:560; letter-spacing:-.03em; line-height:1.1; }
  .hero p{ margin:11px 0 0; color:var(--dim); font-size:14px; }
  .chips{ display:flex; flex-direction:column; gap:0; margin-top:30px; width:100%; max-width:460px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .pchip{ background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--dim); padding:12px 15px; font-size:13px; text-align:left; transition:.12s; }
  .pchip:last-child{ border-bottom:0; }
  .pchip:hover{ color:var(--text); background:var(--hover); }

  /* composer */
  .composer{ padding:16px 32px 24px; }
  .cwrap{ max-width:700px; margin:0 auto; display:flex; align-items:flex-end; gap:10px; background:var(--panel);
    border:1px solid var(--line2); border-radius:var(--r); padding:8px 8px 8px 14px; transition:border-color .12s; }
  .cwrap:focus-within{ border-color:var(--line3); }
  #q{ flex:1; resize:none; border:0; background:transparent; color:var(--text); font:inherit; font-size:13.5px; line-height:1.5;
    max-height:200px; padding:6px 0; } #q:focus{ outline:none; } #q::placeholder{ color:var(--faint); }
  #send{ width:28px; height:28px; flex:none; border:0; border-radius:var(--r); background:var(--inv); color:var(--inv-tx);
    display:grid; place-items:center; transition:.12s; }
  #send:disabled{ background:var(--line2); color:var(--faint); }
  #send svg{ width:14px; height:14px; }
  .hint{ max-width:700px; margin:10px auto 0; color:var(--faint); font-size:10.5px; text-align:center; font-family:var(--mono); }
  .menu-btn{ display:none; }
  @media (max-width:760px){
    .shell{ grid-template-columns:1fr; }
    aside{ position:fixed; z-index:20; width:240px; height:100%; transform:translateX(-100%); transition:.2s; }
    aside.open{ transform:none; }
    .menu-btn{ display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--line2); border-radius:var(--r); background:transparent; }
    .col,.hero{ padding-left:20px; padding-right:20px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="aside">
    <div class="brand"><span class="mark">✦</span><b>self&#8209;extension</b><span class="v">0.2</span></div>
    <button class="newbtn" id="newchat">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Новый чат <kbd>⌘N</kbd>
    </button>
    <div class="seclabel">История</div>
    <div class="threads" id="threads"><div class="empty-list">пока пусто</div></div>
    <div class="sidefoot"><span class="led" id="led"></span><span id="status">подключение…</span></div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-btn" id="menu">☰</button>
      <span class="title" id="title">Новый чат</span>
      <span class="chip" id="chip" style="display:none"></span>
    </div>
    <div class="scroll" id="scroll"><div class="col" id="log"></div></div>
    <div class="composer">
      <div class="cwrap">
        <textarea id="q" rows="1" placeholder="Сообщение агенту…"></textarea>
        <button id="send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — перенос</div>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const log=$('#log'), scroll=$('#scroll'), q=$('#q'), send=$('#send'), threadsEl=$('#threads'),
  titleEl=$('#title'), chip=$('#chip'), led=$('#led'), statusEl=$('#status'), aside=$('#aside');
const uid = (()=>{ let u=localStorage.getItem('agent_uid'); if(!u){u='gui-'+Math.random().toString(36).slice(2,10);localStorage.setItem('agent_uid',u);} return u; })();
let curThread=null, busy=false;
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 't-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(s){
  s = esc(s);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s = s.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g,(m,b)=>'\n<ul>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,b)=>'\n<ol>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
  return s.split(/\n{2,}/).map(p=>/^\s*<(h\d|ul|ol|pre)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
const atBottom = ()=> scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight < 80;
function toBottom(f){ if(f||atBottom()) scroll.scrollTop=scroll.scrollHeight; }
function turnEl(role, html){
  const r=document.createElement('div'); r.className='turn '+(role==='user'?'me':'bot');
  r.innerHTML=`<div class="rolehdr">${role==='user'?'Ты':'Агент'}</div><div class="body">${html}</div>`;
  log.appendChild(r); return r;
}
function showHero(){
  log.innerHTML=`<div class="hero"><div class="bigmark">✦</div><h2>Чем помочь?</h2>
    <p>Спрошу, поищу, посчитаю, открою в браузере — и запомню тебя.</p>
    <div class="chips">
      <button class="pchip">Сравни 3 ноутбука до 100к и посоветуй</button>
      <button class="pchip">Объясни attention в трансформере со ссылками</button>
      <button class="pchip">Посчитай сложный процент по вкладу</button>
    </div></div>`;
  log.querySelectorAll('.pchip').forEach(b=> b.onclick=()=>{ q.value=b.textContent; resize(); ask(); });
}
async function loadThreads(){
  let items=[]; try{ items=await (await fetch('/chats?user_id='+uid)).json(); }catch{}
  if(!items.length){ threadsEl.innerHTML='<div class="empty-list">пока пусто</div>'; return; }
  threadsEl.innerHTML='';
  for(const t of items){
    const d=document.createElement('div'); d.className='thread'+(t.thread_id===curThread?' active':''); d.title=t.title||'';
    d.innerHTML=(t.favorite?'<span class="star">★</span>':'')+esc(t.title||'без названия')+'<button class="del" title="удалить">✕</button>';
    d.onclick=e=>{ if(e.target.classList.contains('del'))return; openThread(t.thread_id); };
    d.querySelector('.del').onclick=async e=>{ e.stopPropagation(); await fetch('/chats/'+t.thread_id,{method:'DELETE'});
      if(t.thread_id===curThread) newChat(); else loadThreads(); };
    threadsEl.appendChild(d);
  }
}
async function openThread(id){
  curThread=id; aside.classList.remove('open');
  let data={messages:[],thread:null}; try{ data=await (await fetch('/chats/'+id)).json(); }catch{}
  titleEl.textContent=(data.thread&&data.thread.title)||'Чат'; log.innerHTML='';
  if(!data.messages.length) showHero();
  else for(const m of data.messages) turnEl(m.role==='user'?'user':'bot', m.role==='user'?esc(m.content):fmt(m.content));
  loadThreads(); toBottom(true); q.focus();
}
function newChat(){ curThread=uuid(); titleEl.textContent='Новый чат'; chip.style.display='none'; showHero(); loadThreads(); q.focus(); }
async function ask(){
  const text=q.value.trim(); if(!text||busy)return; busy=true; send.disabled=true;
  if(log.querySelector('.hero')) log.innerHTML='';
  q.value=''; resize(); turnEl('user', esc(text)); toBottom(true);
  const bot=turnEl('bot','<span class="dots"><span></span><span></span><span></span></span>'); const body=bot.querySelector('.body');
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:uid,thread_id:curThread,query:text})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json(); const tags=[];
    if(d.mode)tags.push('режим '+d.mode); if(d.aim)tags.push('цель: '+d.aim);
    if(d.active_tools&&d.active_tools.length)tags.push(d.active_tools.join(' · '));
    body.innerHTML=fmt(d.answer||'(пустой ответ)')+(tags.length?'<div class="meta">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'');
    if(d.mode){ chip.textContent=d.mode; chip.style.display=''; } if(d.title) titleEl.textContent=d.title; loadThreads();
  }catch(e){ body.innerHTML='<p style="color:var(--text)">ошибка: '+esc(String(e.message||e))+'</p>'; }
  finally{ busy=false; send.disabled=q.value.trim()===''; toBottom(); q.focus(); }
}
async function ping(){ try{ await fetch('/chats?user_id='+uid); led.classList.add('on'); statusEl.textContent=uid; }
  catch{ led.classList.remove('on'); statusEl.textContent='offline'; } }
function resize(){ q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,200)+'px'; }
$('#newchat').onclick=newChat; $('#menu').onclick=()=>aside.classList.toggle('open'); send.onclick=ask;
q.addEventListener('input',()=>{ resize(); send.disabled=q.value.trim()===''; });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(); }});
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){ e.preventDefault(); newChat(); }});
newChat(); ping(); setInterval(ping,15000);
</script>
</body>
</html>
